name: Core tests

# Core는 게임/BepInEx 없이 빌드되므로 CI에서 유닛 테스트를 돌린다.
# Plugin은 게임 DLL이 필요해서 CI에서는 빌드하지 않는다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project Tests -c Release
